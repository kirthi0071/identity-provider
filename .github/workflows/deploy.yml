name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}
  DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  BACKEND_SERVICE: ${{ secrets.BACKEND_SERVICE_NAME }}
  FRONTEND_SERVICE: ${{ secrets.FRONTEND_SERVICE_NAME }}
  RUNTIME_SA: identity-provider-runtime@project-c98d2dac-2409-44bd-aba.iam.gserviceaccount.com
  TENANT_ID: India-p9rv0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify WIF authentication
        run: |
          set -euo pipefail
          gcloud auth list
          gcloud config set project "${PROJECT_ID}"
          gcloud config get-value project

      - name: Verify deployment prerequisites
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${REPOSITORY}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(name)"
          echo "Runtime service account configured: ${RUNTIME_SA}"

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend:${GITHUB_SHA}"
          docker build -t "${IMAGE}" ./backend
          docker push "${IMAGE}"
          echo "BACKEND_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy backend
        run: |
          set -euo pipefail
          gcloud run deploy "${BACKEND_SERVICE}" \
            --image "${BACKEND_IMAGE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${RUNTIME_SA}" \
            --set-env-vars "IDENTITY_PLATFORM_TENANT_ID=${TENANT_ID}" \
            --set-secrets "TWILIO_ACCOUNT_SID=twilio-account-sid:latest,TWILIO_AUTH_TOKEN=twilio-auth-token:latest,TWILIO_VERIFY_SERVICE_SID=twilio-verify-service-sid:latest,IDENTITY_PLATFORM_API_KEY=identity-platform-api-key:latest,OTP_SESSION_SECRET=otp-session-secret:latest" \
            --allow-unauthenticated

      - name: Resolve backend URL
        id: backend
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${BACKEND_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "Backend URL: ${URL}"

      - name: Build and push frontend
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/frontend:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_BACKEND_URL="${{ steps.backend.outputs.url }}" \
            -t "${IMAGE}" ./frontend
          docker push "${IMAGE}"
          echo "FRONTEND_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy frontend
        run: |
          set -euo pipefail
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${FRONTEND_IMAGE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${RUNTIME_SA}" \
            --allow-unauthenticated

      - name: Smoke test backend
        run: |
          set -euo pipefail
          BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "${BACKEND_URL}/health"
          echo
